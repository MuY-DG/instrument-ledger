<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InstrumentLedger</title>
    <script>
      try {
        var t = localStorage.getItem("instrument_ledger_theme_mode");
        var isDark =
          t === "dark" ||
          ((!t || t === "system") &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f4f5f7] text-zinc-950 dark:bg-[#121318] dark:text-zinc-50 antialiased selection:bg-indigo-500/20 selection:text-indigo-900 dark:selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

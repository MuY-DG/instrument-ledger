name: Build and Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布标签版本号（例如 v1.3.0；留空则仅构建 macOS & Windows 安装包产物，不创建 Release）"
        required: false
        default: ""
      draft:
        description: "是否发布为草稿 Release（仅在填写版本号时生效）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            platform: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg"
            bundle_dir: "src-tauri/target/universal-apple-darwin/release/bundle"
          - name: windows-x64
            platform: windows-latest
            rust_targets: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
            bundle_dir: "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run frontend typecheck & unit checks
        shell: bash
        run: |
          pnpm build
          pnpm test:excel
          pnpm test:markdown
          pnpm test:ui-scale

      - name: Run Rust backend tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build signed Tauri desktop installer & updater bundle
        shell: bash
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build ${{ matrix.args }}

      - name: Stage installer & updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          shopt -s nullglob

          if [[ "${{ matrix.name }}" == "macos-universal" ]]; then
            dmg_files=(${{ matrix.bundle_dir }}/dmg/*.dmg)
            tar_files=(${{ matrix.bundle_dir }}/macos/*.app.tar.gz)
            sig_files=(${{ matrix.bundle_dir }}/macos/*.app.tar.gz.sig)

            if [ ${#dmg_files[@]} -eq 0 ] || [ ${#tar_files[@]} -eq 0 ] || [ ${#sig_files[@]} -eq 0 ]; then
              echo "Missing expected macOS bundle or updater artifacts!"
              find src-tauri/target -maxdepth 6 -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" \) || true
              exit 1
            fi

            cp -v "${dmg_files[@]}" "${tar_files[@]}" "${sig_files[@]}" release-artifacts/
          else
            exe_files=(${{ matrix.bundle_dir }}/nsis/*-setup.exe)
            sig_files=(${{ matrix.bundle_dir }}/nsis/*-setup.exe.sig)

            if [ ${#exe_files[@]} -eq 0 ] || [ ${#sig_files[@]} -eq 0 ]; then
              echo "Missing expected Windows NSIS installer or updater signature!"
              find src-tauri/target -maxdepth 6 -type f \( -name "*.exe" -o -name "*.sig" \) || true
              exit 1
            fi

            cp -v "${exe_files[@]}" "${sig_files[@]}" release-artifacts/
          fi

          ls -lh release-artifacts/

      - name: Upload installer & updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InstrumentLedger-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built installers & updater bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate latest.json & publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${INPUT_TAG}"
          fi
          export TAG

          echo "Publishing Release for tag: ${TAG}"
          ls -lh release-assets/

          # actions/checkout@v4 overwrites refs/tags/${TAG} with the peeled commit SHA;
          # force-fetch the tag ref so annotated tag messages remain intact.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true

          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone

          repo = os.environ["GH_REPO"]
          tag = os.environ["TAG"]
          version = tag.lstrip("vV")

          def run_cmd(*args):
              res = subprocess.run(
                  list(args),
                  capture_output=True,
                  text=True,
              )
              return res.returncode, res.stdout.strip()

          def run_git(*args):
              return run_cmd("git", *args)

          def is_placeholder_tag_message(msg: str) -> bool:
              stripped = msg.strip()
              if not stripped:
                  return True
              return bool(re.fullmatch(r"Release\s+v?\d+(?:\.\d+)*", stripped, flags=re.IGNORECASE))

          def read_annotated_tag_message(current_tag: str) -> str:
              # 1) Read from local git annotated tag object
              rc, obj_type = run_git("cat-file", "-t", f"refs/tags/{current_tag}")
              if rc == 0 and obj_type == "tag":
                  rc_msg, tag_msg = run_git(
                      "for-each-ref",
                      "--format=%(contents)",
                      f"refs/tags/{current_tag}",
                  )
                  if rc_msg == 0 and not is_placeholder_tag_message(tag_msg):
                      return tag_msg.strip()

              # 2) Fallback to GitHub Git Data API in case checkout stripped tag annotations
              rc_ref, ref_json = run_cmd("gh", "api", f"repos/{repo}/git/ref/tags/{current_tag}")
              if rc_ref == 0 and ref_json:
                  try:
                      ref_obj = json.loads(ref_json).get("object", {})
                      if ref_obj.get("type") == "tag" and ref_obj.get("sha"):
                          rc_tag, tag_json = run_cmd(
                              "gh", "api", f"repos/{repo}/git/tags/{ref_obj['sha']}"
                          )
                          if rc_tag == 0 and tag_json:
                              msg = (json.loads(tag_json).get("message") or "").strip()
                              if not is_placeholder_tag_message(msg):
                                  return msg
                  except Exception:
                      pass

              return ""

          def find_previous_tag(current_tag: str, target_ref: str):
              # Prefer closest reachable ancestor v* tag
              rc_desc, desc_tag = run_git(
                  "describe", "--tags", "--abbrev=0", "--match", "v*", f"{target_ref}^"
              )
              if rc_desc == 0 and desc_tag and desc_tag != current_tag:
                  return desc_tag

              # Fallback to descending version tag list
              rc_tags, tags_out = run_git("tag", "--list", "--sort=-v:refname", "v*")
              all_tags = [t.strip() for t in tags_out.splitlines() if t.strip()] if rc_tags == 0 else []
              if current_tag in all_tags:
                  idx = all_tags.index(current_tag)
                  if idx + 1 < len(all_tags):
                      return all_tags[idx + 1]
                  return None
              for t in all_tags:
                  if t != current_tag:
                      return t
              return None

          def categorize_commits(subjects: list[str]) -> str:
              features = []
              improvements = []
              fixes = []

              cc_re = re.compile(r"^([a-zA-Z]+)(?:\(([^)]*)\))?!?:\s*(.+)$")
              for raw in subjects:
                  line = raw.strip()
                  if not line:
                      continue
                  m = cc_re.match(line)
                  if m:
                      ctype = m.group(1).lower()
                      scope = (m.group(2) or "").lower()
                      desc = m.group(3).strip()
                      if ctype == "chore" and "release" in scope:
                          continue
                      if ctype == "feat":
                          features.append(desc)
                      elif ctype == "fix":
                          fixes.append(desc)
                      else:
                          improvements.append(desc)
                  else:
                      improvements.append(line)

              sections = []
              if features:
                  sections.append("### 新功能\n\n" + "\n".join(f"- {item}" for item in features))
              if improvements:
                  sections.append("### 改进\n\n" + "\n".join(f"- {item}" for item in improvements))
              if fixes:
                  sections.append("### 修复\n\n" + "\n".join(f"- {item}" for item in fixes))
              return "\n\n".join(sections)

          def build_changelog(current_tag: str) -> str:
              # 1) Prefer annotated git tag message when present
              tag_msg = read_annotated_tag_message(current_tag)
              if tag_msg:
                  return tag_msg

              # 2) Fallback to commits since previous v* tag, grouped like ### 新功能 / ### 改进 / ### 修复
              target_ref = (
                  f"refs/tags/{current_tag}"
                  if run_git("rev-parse", "--verify", f"refs/tags/{current_tag}")[0] == 0
                  else "HEAD"
              )
              prev_tag = find_previous_tag(current_tag, target_ref)
              rev_range = f"{prev_tag}..{target_ref}" if prev_tag else target_ref
              rc_log, log_out = run_git("log", "--no-merges", "--pretty=format:%s", rev_range)
              if rc_log == 0 and log_out.strip():
                  grouped = categorize_commits(log_out.splitlines())
                  if grouped:
                      return grouped

              return "### 改进\n\n- 常规体验优化与稳定性提升"

          changelog = build_changelog(tag)
          if changelog.lstrip().startswith("#"):
              changelog_section = changelog
          else:
              changelog_section = f"### 改进\n\n{changelog}"

          mac_tar = sorted(glob.glob("release-assets/*.app.tar.gz"))
          mac_sig = sorted(glob.glob("release-assets/*.app.tar.gz.sig"))
          win_exe = sorted(glob.glob("release-assets/*-setup.exe"))
          win_sig = sorted(glob.glob("release-assets/*-setup.exe.sig"))

          if not mac_tar or not mac_sig:
              raise SystemExit(f"Missing macOS updater files: tar={mac_tar}, sig={mac_sig}")
          if not win_exe or not win_sig:
              raise SystemExit(f"Missing Windows updater files: exe={win_exe}, sig={win_sig}")

          mac_tar_name = os.path.basename(mac_tar[0])
          win_exe_name = os.path.basename(win_exe[0])

          with open(mac_sig[0], encoding="utf-8") as f:
              mac_sig_val = f.read().strip()
          with open(win_sig[0], encoding="utf-8") as f:
              win_sig_val = f.read().strip()

          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          manifest = {
              "version": version,
              "notes": changelog_section,
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": mac_sig_val,
                      "url": f"{base_url}/{mac_tar_name}",
                  },
                  "darwin-x86_64": {
                      "signature": mac_sig_val,
                      "url": f"{base_url}/{mac_tar_name}",
                  },
                  "windows-x86_64": {
                      "signature": win_sig_val,
                      "url": f"{base_url}/{win_exe_name}",
                  },
                  "windows-x86_64-nsis": {
                      "signature": win_sig_val,
                      "url": f"{base_url}/{win_exe_name}",
                  },
              },
          }

          with open("release-assets/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")

          release_notes = f"{changelog_section}\n"

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(release_notes)

          print("Generated release-assets/latest.json:")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          print("\nGenerated release-notes.md:")
          with open("release-notes.md", encoding="utf-8") as f:
              print(f.read())
          PY

          DRAFT_FLAG=""
          if [[ "${INPUT_DRAFT}" == "true" ]]; then
            DRAFT_FLAG="--draft"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets with --clobber and updating notes..."
            gh release upload "${TAG}" release-assets/* --clobber
            gh release edit "${TAG}" \
              --title "监视与测量设备管理台账 ${TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "监视与测量设备管理台账 ${TAG}" \
              --notes-file release-notes.md \
              ${DRAFT_FLAG}
          fi
